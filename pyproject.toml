[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liai"
version = "1.0.0"
description = "LinkedIn AI Networking Assistant — an AI-powered CLI for smart professional networking"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "liai Contributors" }]
keywords = ["linkedin", "ai", "networking", "cli", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

dependencies = [
    "typer[all]>=0.12.3",
    "rich>=13.7.1",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.3.0",
    "playwright>=1.44.0",
    "pandas>=2.2.2",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "openai>=1.30.1",
    "openpyxl>=3.1.3",
    "jinja2>=3.1.4",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
]

[project.scripts]
liai = "linkedin_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["linkedin_ai"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --cov=linkedin_ai --cov-report=term-missing"
